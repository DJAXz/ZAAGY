<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda&family=Instrument+Serif:ital@0;1&family=Pinyon+Script&family=Space+Mono&family=Unbounded:wght@500&display=swap">
<style>
:root{--bg:#000;--pill:#2b2b2b;--pill2:#3d3d3d;--tx:#fff;--mut:#a5a5a5;--red:#e60023;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden;font:500 15px/1.3 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:#1f1f1fee;border-radius:34px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#nav button{width:41px;height:50px;border:0;border-radius:26px;background:none;color:var(--mut);font:600 9px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button b{font-size:19px;font-weight:400;line-height:1}
#nav button.on{background:var(--pill2);color:#fff}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(80px + env(safe-area-inset-bottom,0px));max-height:50%;overflow:auto;background:#141414f2;border-radius:28px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;align-items:center;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.ch{flex:none;border:0;border-radius:20px;padding:10px 14px;background:var(--pill);color:#fff;font:600 13px system-ui}
.ch.on{background:#fff;color:#000}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #0000;margin:0 2px}
.sw.on{border-color:#fff}
.row span{flex:none;color:var(--mut);font-size:13px}
input[type=range]{flex:1;min-width:120px;accent-color:#fff}
.ti{flex:1;min-width:150px;background:var(--pill);border:0;border-radius:20px;padding:10px 14px;color:#fff;font:500 16px system-ui;-webkit-user-select:text;user-select:text}
.h{margin:0;color:var(--mut);font-size:12px}
.ms{columns:2;column-gap:8px}
.cd{break-inside:avoid;margin-bottom:8px;border-radius:22px;overflow:hidden;background:#111;position:relative}
.cd canvas{display:block;width:100%;height:auto}
.cd span{position:absolute;left:12px;bottom:10px;font:600 12px system-ui;text-shadow:0 1px 6px #000a}
.cd.on{outline:2px solid #fff}
.bar{height:6px;background:var(--pill);border-radius:3px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--red)}
#back{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:#ffffff22;color:#fff6;display:none}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;font:600 13px system-ui;opacity:0;transition:opacity .3s;pointer-events:none}
@media (orientation:landscape) and (max-height:560px){
.h{display:none}
#nav{padding:4px;gap:2px;bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{height:38px;gap:0;font-size:8px}
#nav button b{font-size:17px}
#sheet{left:auto;right:calc(8px + env(safe-area-inset-right,0px));width:min(56vw,520px);bottom:calc(54px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 66px);padding:8px;border-radius:20px}
.row{padding:1px 0 5px}
.ch{padding:7px 11px;font-size:12px}
.ms{columns:3}
}
#tg,#fs{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:50%;border:0;background:#2b2b2bcc;color:#fff;font:600 17px system-ui;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tg{right:calc(10px + env(safe-area-inset-right,0px))}#fs{right:calc(58px + env(safe-area-inset-right,0px))}
#lock{position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lock h1{margin:0;font:500 22px system-ui}#lock p{margin:0;color:var(--mut);font-size:13px}#lock input{width:min(280px,80vw);text-align:center}
</style></head><body>

const rs1=(P,sp)=>{const O=[P[0]];let a=P[0],d=0;for(let i=1;i<P.length;i++){const b=P[i];let L=Math.hypot(b[0]-a[0],b[1]-a[1]);while(L>0&&d+L>=sp){const k=(sp-d)/L;a=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];O.push(a);L=Math.hypot(b[0]-a[0],b[1]-a[1]);d=0}d+=L;a=b}O.push(P[P.length-1]);return O};
const ma=(P,cl)=>{const n=P.length,O=[];for(let i=0;i<n;i++){let x=0,y=0,c=0;for(let k=-2;k<=2;k++){let j=i+k;if(cl)j=(j+n)%n;else if(j<0||j>=n)continue;x+=P[j][0];y+=P[j][1];c++}O.push([x/c,y/c])}if(!cl){O[0]=P[0];O[n-1]=P[n-1]}return O};
const ch1=(P,cl)=>{const O=[],n=P.length;for(let i=0;i<(cl?n:n-1);i++){const a=P[i],b=P[(i+1)%n];O.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}if(!cl){O.unshift(P[0]);O.push(P[n-1])}return O};
const crv=(P,cl)=>{let Q=rs1(cl?P.concat([P[0]]):P,7);if(cl)Q.pop();if(Q.length<5)return P;for(let r=0;r<2;r++)Q=ma(Q,cl);Q=ch1(Q,cl);if(cl)Q.push([...Q[0]]);return Q};
const pl=P=>{let L=0;for(let i=1;i<P.length;i++)L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);return L};
const inp=(P,x,y)=>{let r=false;for(let i=0,j=P.length-1;i<P.length;j=i++)if((P[i][1]>y)!=(P[j][1]>y)&&x<(P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1])+P[i][0])r=!r;return r};
const fh=(x,y)=>{for(let k=ST.length-1;k>=0;k--)if(ST[k].cl&&inp(ST[k].p,x,y))return k;return -1};
const sm1=P=>{let Q=P.filter((_,i)=>i%3==0||i==P.length-1);for(let r=0;r<2;r++){const O=[Q[0]];for(let i=0;i<Q.length-1;i++){const a=Q[i],b=Q[i+1];O.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}O.push(Q[Q.length-1]);Q=O}return Q};
const dn=P=>{const O=[];for(let i=0;i<P.length-1;i++)for(let k=0;k<8;k++)O.push([P[i][0]+(P[i+1][0]-P[i][0])*k/8,P[i][1]+(P[i+1][1]-P[i][1])*k/8]);O.push(P[P.length-1]);return O};
const dst=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
